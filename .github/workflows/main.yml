name: Sync Past Submissions

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and Sync Codeforces Submissions
        run: |
          python - << 'EOF'
          import os, json, urllib.request

          HANDLE = "taraqaziz508"
          url = f"https://codeforces.com/api/user.status?handle={HANDLE}&from=1&count=10000"
          
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          try:
              response = urllib.request.urlopen(req)
              data = json.loads(response.read().decode())
          except Exception as e:
              print(f"Error fetching submissions: {e}")
              exit(0)

          if data.get("status") != "OK":
              print("Failed to get submissions from Codeforces")
              exit(0)

          submissions = data.get("result", [])
          saved = 0

          for sub in submissions:
              if sub.get("verdict") == "OK":
                  problem = sub.get("problem", {})
                  contest_id = problem.get("contestId", "Misc")
                  index = problem.get("index", "A")
                  name = problem.get("name", "Problem").replace("/", "_")
                  lang = sub.get("programmingLanguage", "cpp").lower()

                  ext = ".cpp"
                  if "py" in lang: ext = ".py"
                  elif "java" in lang: ext = ".java"

                  folder = f"codeforces/{contest_id}{index} - {name}"
                  os.makedirs(folder, exist_ok=True)
                  filepath = os.path.join(folder, f"solution{ext}")

                  if not os.path.exists(filepath):
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(f"// Contest: {contest_id}, Problem: {index} ({name})\n")
                          f.write(f"// Language: {sub.get('programmingLanguage')}\n")
                          f.write(f"// Submission ID: {sub.get('id')}\n\n")
                      saved += 1

          print(f"Successfully processed {saved} new submissions!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-sync past Codeforces submissions" || echo "No changes to commit"
          git push
